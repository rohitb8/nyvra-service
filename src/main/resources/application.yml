# Profile-independent defaults. NO secrets, NO environment specifics here.
# Environment values come from application-<profile>.yml + environment variables + the secret store.
# See design-docs/ENVIRONMENTS.md.

spring:
  application:
    name: nyvra-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${NYVRA_DB_URL}
    username: ${NYVRA_DB_USERNAME}
    password: ${NYVRA_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${NYVRA_DB_POOL_MAX:10}
      pool-name: nyvra-cp

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      url: ${NYVRA_REDIS_URL:redis://localhost:6379}

  rabbitmq:
    addresses: ${NYVRA_RABBITMQ_URL:amqp://guest:guest@localhost:5672}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NYVRA_OIDC_ISSUER_URI}

  docker:
    compose:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: nyvra-web
      use-pkce-with-authorization-code-grant: true

nyvra:
  cors:
    allowed-origins: ${NYVRA_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  oidc:
    # Used only to make Swagger UI "Authorize" work; not security-critical.
    auth-url: ${NYVRA_OIDC_AUTH_URL:http://localhost:8081/realms/nyvra/protocol/openid-connect/auth}
    token-url: ${NYVRA_OIDC_TOKEN_URL:http://localhost:8081/realms/nyvra/protocol/openid-connect/token}
  jobs:
    enabled: true

logging:
  level:
    root: INFO
    com.rohit.nyvra: INFO
