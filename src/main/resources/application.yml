# Profile-independent defaults. NO secrets, NO environment specifics here.
# Environment values come from application-<profile>.yml + environment variables + the secret store.
# See docs/operations/ENVIRONMENTS.md.

spring:
  application:
    name: nyvra-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${NYVRA_DB_URL}
    username: ${NYVRA_DB_USERNAME}
    password: ${NYVRA_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${NYVRA_DB_POOL_MAX:10}
      pool-name: nyvra-cp

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      url: ${NYVRA_REDIS_URL:redis://localhost:6379}

  rabbitmq:
    addresses: ${NYVRA_RABBITMQ_URL:amqp://guest:guest@localhost:5672}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NYVRA_OIDC_ISSUER_URI}

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 5MB      # payslip uploads; the service also checks, for a clearer 413
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: nyvra-web
      use-pkce-with-authorization-code-grant: true

nyvra:
  cors:
    allowed-origins: ${NYVRA_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  oidc:
    # Used only to make Swagger UI "Authorize" work; not security-critical.
    auth-url: ${NYVRA_OIDC_AUTH_URL:http://localhost:8081/realms/nyvra/protocol/openid-connect/auth}
    token-url: ${NYVRA_OIDC_TOKEN_URL:http://localhost:8081/realms/nyvra/protocol/openid-connect/token}
  income:
    # Where uploaded payslips live. `local` (default) writes under a temp directory for dev/tests;
    # `s3` uses the S3 API (MinIO locally, a bucket per env elsewhere). See docs/operations/ENVIRONMENTS.md.
    payslip-storage:
      type: ${NYVRA_PAYSLIP_STORAGE:local}
      endpoint: ${NYVRA_S3_ENDPOINT:http://localhost:9000}
      bucket: ${NYVRA_S3_BUCKET:nyvra-documents}
      access-key: ${NYVRA_S3_ACCESS_KEY:}
      secret-key: ${NYVRA_S3_SECRET_KEY:}
      region: ${NYVRA_S3_REGION:}
  # FINANCIAL_RULES.md §8 / HEALTH_SCORE_SPEC.md parameters. Changing a value that alters user-visible
  # scores requires bumping ruleset-version.
  financial-rules:
    ruleset-version: "2026.1"
    score-spec-version: "2026.1"
    min-evaluated-sub-scores: 3
    weights:
      savings: 0.25
      spending-control: 0.15
      emergency-fund: 0.20
      debt: 0.20
      diversification: 0.15
      goal-progress: 0.05
    bands: { fair-min: 40, good-min: 60, excellent-min: 80 }
    caps:
      emergency-fund-below-min: 45
      high-interest-debt: 55
      fixed-obligations-over-ceiling: 55
      negative-savings: 40
    savings: { target-rate: 0.20, stretch-rate: 0.30, min-acceptable: 0.10 }
    spending:
      essential-full-score-ratio: 0.50
      essential-zero-score-ratio: 0.75
      discretionary-full-score-ratio: 0.30
      discretionary-zero-score-ratio: 0.55
      essential-target-ratio: 0.50
      discretionary-target-ratio: 0.30
      essential-critical-ratio: 0.70
      lifestyle-creep-penalty: 10
    emergency: { months-target: 6, months-min: 3 }
    debt:
      dti-target: 0.36
      dti-ceiling: 0.43
      dti-above-target-penalty: 15
      dti-above-ceiling-penalty: 35
      cc-util-target: 0.30
      cc-util-high: 0.50
      cc-util-critical: 0.80
      cc-util-above-target-penalty: 10
      cc-util-above-high-penalty: 25
      cc-util-above-critical-penalty: 40
      high-interest-penalty: 30
      revolving-balance-penalty: 15
    penalty-status: { warn-at: 20, critical-at: 45 }
    confidence:
      evaluated-weight-share: 0.4
      data-freshness: 0.4
      history-depth: 0.2
      fresh-within-days: 7
      stale-after-days: 45
      stale-factor: 0.3
      history-min-days: 30
      history-full-days: 180
      medium-from: 0.5
      high-above: 0.8
  # How the health score's drivers are gathered from income, expenses, accounts, portfolio and goals:
  # windows, FINANCIAL_RULES.md §4.2/§6 gates and the recompute debounce (HEALTH_SCORE_SPEC.md §5).
  health-score-inputs:
    window-months: 3
    history-months: 6
    min-spend-months: 2
    min-emergency-history-months: 3
    variable-income-months-target: 9
    min-corpus: 50000
    min-holdings: 3
    single-stock-warn-share: 0.10
    single-stock-critical-share: 0.20
    single-stock-warn-penalty: 10
    single-stock-critical-penalty: 25
    single-stock-max-penalty: 25
    # FINANCIAL_RULES.md §4.1 glide path and HEALTH_SCORE_SPEC.md §3.5 drift penalties. The user's age is not
    # stored yet, so assumed-age stands in for it until it is captured.
    allocation:
      assumed-age: 35
      glide-base: 100
      glide-min-pct: 30
      glide-max-pct: 90
      conservative-adjust: -15
      balanced-adjust: 0
      aggressive-adjust: 10
      target-min-pct: 20
      target-max-pct: 90
      rebalance-band: 5
      rebalance-band-hard: 10
      drift-penalty: 10
      drift-hard-penalty: 25
      # Mutual funds and NPS mix equity and debt, so drift is only judged while they stay under this share.
      max-unclassified-share: 0.10
    debounce-seconds: 60
  jobs:
    enabled: true
  partitions:
    # MonthlyRangePartitionMaintenance keeps transaction/expense partitions this many months ahead.
    months-ahead: 3
    cron: "0 15 2 * * *"
  crypto:
    # Required — the app refuses to start without valid 32-byte base64 keys (ENVIRONMENTS.md §6).
    field-encryption-key: ${NYVRA_FIELD_ENCRYPTION_KEY}
    field-encryption-key-previous: ${NYVRA_FIELD_ENCRYPTION_KEY_PREVIOUS:}
    blind-index-key: ${NYVRA_BLIND_INDEX_KEY}

logging:
  level:
    root: INFO
    com.rohit.nyvra: INFO
