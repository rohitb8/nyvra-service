# User date-of-birth contract fragment — to be folded into nyvra-api-v1.yaml (paths + components) in a later pass.
# Kept separate so the date-of-birth PR does not touch the shared contract file. References to shared components
# point at nyvra-api-v1.yaml.
#
# Also folds in one additive property on the existing UserProfileResponse schema (GET /users/me):
#   dateOfBirth: { type: string, format: date, description: 'Omitted until the user sets it.' }
paths:
  /api/v1/users/me/date-of-birth:
    put:
      tags: [User]
      operationId: updateDateOfBirth
      summary: Set or clear date of birth
      description: |
        The health score uses it to set the age-based equity target (FINANCIAL_RULES 4.1). Without one the score
        assumes an age of 35. Changing it queues a score recompute. Send `null` to clear it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDateOfBirthRequest' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: 'nyvra-api-v1.yaml#/components/schemas/UserProfileResponse' }
        '400': { $ref: 'nyvra-api-v1.yaml#/components/responses/BadRequest' }
        '401': { $ref: 'nyvra-api-v1.yaml#/components/responses/Unauthorized' }
        '422':
          description: |
            `INVALID_DATE_OF_BIRTH` — the date is in the future or more than 120 years ago.
          content:
            application/json:
              schema: { $ref: 'nyvra-api-v1.yaml#/components/schemas/ApiError' }
        '500': { $ref: 'nyvra-api-v1.yaml#/components/responses/InternalError' }

components:
  schemas:
    UpdateDateOfBirthRequest:
      type: object
      required: [dateOfBirth]
      properties:
        dateOfBirth:
          type: [string, 'null']
          format: date
          example: '1990-05-17'
          description: ISO date in the past, at most 120 years ago. `null` clears it.
