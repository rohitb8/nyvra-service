# Contract additions for the portfolio extras (XIRR, valuation history, FX, admin prices, price feed).
# A fragment, merged into nyvra-api-v1.yaml when the contract is next exported from springdoc; it exists
# separately so this change does not edit the shared contract file.
# Endpoints marked "admin only" need the ADMIN realm role and answer 403 otherwise.
paths:
  /api/v1/portfolio/instruments/{instrumentId}/quotes:
    post:
      summary: Record a price for an instrument (admin only)
      description: >-
        CHANGED: previously open to any user. Quotes are shared by all users, so only users with the ADMIN
        realm role may record one; everyone else receives 403.
  /api/v1/portfolio/returns:
    get:
      tags: [Portfolio]
      summary: Annualised return (XIRR)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnsResponse' } } } }
  /api/v1/portfolio/valuation-history:
    get:
      tags: [Portfolio]
      summary: Portfolio value over time
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: interval, in: query, schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY], default: DAILY } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuationHistoryResponse' } } } }
        '400': { description: Inverted range or more than 400 points }
  /api/v1/portfolio/fx-rates:
    get:
      tags: [Portfolio]
      summary: List FX rates against INR
      parameters:
        - { name: currency, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FxRateResponse' } } } } }
    post:
      tags: [Portfolio]
      summary: Set an FX rate (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordFxRateRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FxRateResponse' } } } }
        '403': { description: Not an admin }
        '422': { description: RATE_IN_FUTURE }
  /api/v1/portfolio/fx-rates/convert:
    get:
      tags: [Portfolio]
      summary: Convert an amount between currencies
      parameters:
        - { name: amount, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversionResponse' } } } }
        '422': { description: FX_RATE_UNAVAILABLE }
  /api/v1/portfolio/price-feed/sync:
    post:
      tags: [Portfolio]
      summary: Pull prices and FX rates from the price feed (admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PriceFeedSyncResponse' } } } }
        '403': { description: Not an admin }
components:
  schemas:
    ReturnsResponse:
      type: object
      required: [includedCount, excludedCount, asOf, holdings]
      properties:
        xirrPct: { type: number, description: Percent points; omitted when undefined }
        includedCount: { type: integer }
        excludedCount: { type: integer }
        asOf: { type: string, format: date-time }
        holdings:
          type: array
          items:
            type: object
            required: [holdingId, instrumentId]
            properties:
              holdingId: { type: string, format: uuid }
              instrumentId: { type: string, format: uuid }
              xirrPct: { type: number }
    ValuationHistoryResponse:
      type: object
      required: [currency, interval, points]
      properties:
        currency: { type: string }
        interval: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        points:
          type: array
          items:
            type: object
            required: [date, value, invested, pricedHoldingCount, unpricedHoldingCount]
            properties:
              date: { type: string, format: date }
              value: { $ref: '#/components/schemas/Money' }
              invested: { $ref: '#/components/schemas/Money' }
              pricedHoldingCount: { type: integer }
              unpricedHoldingCount: { type: integer }
    RecordFxRateRequest:
      type: object
      required: [currency, inrPerUnit]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Not INR }
        rateDate: { type: string, format: date, description: Defaults to today; not in the future }
        inrPerUnit: { type: string, description: Decimal string, at most 6 decimals, above zero }
    FxRateResponse:
      type: object
      required: [currency, rateDate, inrPerUnit, source]
      properties:
        currency: { type: string }
        rateDate: { type: string, format: date }
        inrPerUnit: { type: string }
        source: { type: string, enum: [AA, MANUAL, DERIVED, GMAIL] }
    ConversionResponse:
      type: object
      required: [from, to, date]
      properties:
        from: { $ref: '#/components/schemas/Money' }
        to: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        rateDate: { type: string, format: date, description: Omitted when no rate was needed }
    PriceFeedSyncResponse:
      type: object
      required: [pricesStored, fxRatesStored]
      properties:
        pricesStored: { type: integer }
        fxRatesStored: { type: integer }
