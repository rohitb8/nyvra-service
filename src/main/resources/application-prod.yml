# Production. Real users, real data. Everything sensitive comes from the platform secret manager.
# See docs/operations/ENVIRONMENTS.md.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # Migrations run as a dedicated, backup-verified, gated CI step BEFORE the app image deploys.
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${NYVRA_DB_POOL_MAX:30}

server:
  forward-headers-strategy: framework

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${NYVRA_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.rohit.nyvra: INFO
