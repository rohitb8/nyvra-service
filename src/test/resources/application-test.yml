# Test profile. Integration tests that need real infra use Testcontainers (see TEST_STRATEGY.md, planned)
# and register their own datasource via @ServiceConnection. This file holds only static test config.

spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tests mint their own JWTs / mock the decoder; this is a placeholder issuer.
          issuer-uri: http://localhost:0/realms/nyvra

nyvra:
  jobs:
    enabled: false

logging:
  level:
    org.testcontainers: INFO
