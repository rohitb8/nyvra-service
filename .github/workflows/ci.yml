name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's postgres service (same image, same creds) so Flyway validation
    # below runs against the same engine local dev and prod use.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: nyvra
          POSTGRES_PASSWORD: nyvra
          POSTGRES_DB: nyvra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyvra -d nyvra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Exec bit should survive git, but this is a common cross-OS/checkout-action gotcha — cheap
      # insurance against ./mvnw failing with "Permission denied".
      - run: chmod +x mvnw

      # Validates the Flyway migrations apply cleanly to an empty database, independent of whether
      # any test happens to exercise the DB. pom.xml's flyway-maven-plugin defaults to the local
      # compose Postgres's credentials, which happen to match this service too, but pass them
      # explicitly so this step doesn't silently depend on that coincidence.
      - name: Validate Flyway migrations
        run: >-
          ./mvnw -B -ntp flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/nyvra
          -Dflyway.user=nyvra
          -Dflyway.password=nyvra

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # openapi/nyvra-api-v1.yaml doesn't exist yet (TODO.md Phase 3.5). Once it does, this needs to
      # actually boot the app and diff the exported spec — deliberately not automated yet because
      # SecurityConfig's JwtDecoder resolves against a live OIDC issuer at context startup, and there's
      # no Keycloak in this job; wiring a mock-oauth2-server (TODO.md Phase 1.3) first avoids adding a
      # flaky external dependency to every PR just for a docs-drift check.
      - name: OpenAPI drift check (placeholder)
        run: |
          if [ -f src/main/resources/openapi/nyvra-api-v1.yaml ]; then
            echo "openapi/nyvra-api-v1.yaml exists, but automated regeneration+diff isn't wired up yet."
            echo "See TODO.md Phase 1.3 (mock-oauth2-server) / Phase 3.5 (OpenAPI export & freeze)."
          else
            echo "openapi/nyvra-api-v1.yaml not committed yet — nothing to check. See TODO.md Phase 3.5."
          fi

      - name: Build Docker image
        run: docker build -t nyvra-service:ci .
